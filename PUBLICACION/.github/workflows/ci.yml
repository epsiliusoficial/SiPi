name: SiPi CI

# Corre automaticamente en cada push y pull request, para asegurar que
# los cambios nuevos no rompan las funciones que ya andaban (#20 de la
# lista original: pruebas automatizadas + CI/CD).
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  probar:
    name: Tests en ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes

      - name: Chequear sintaxis y lint (pyflakes)
        run: python -m pyflakes sipi.py editor_sipi.py sipi_cli.py generar_exe.py publicar.py proteger_codigo.py tests/test_suite.py

      - name: Correr la suite de tests
        run: python -m pytest tests/test_suite.py -v

      - name: Probar que el interprete arranca (smoke test)
        shell: bash
        run: |
          echo 'programa "CI"' > /tmp/ci_smoke.sipi
          echo 'decir "SiPi funciona en ${{ matrix.os }}"' >> /tmp/ci_smoke.sipi
          python sipi.py /tmp/ci_smoke.sipi
